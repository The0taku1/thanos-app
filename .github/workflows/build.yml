name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: chmod +x gradlew
      - name: Build
        run: |
          ./gradlew assembleDebug --console=plain > build.log 2>&1 || { echo "=== ERREURS ==="; grep -n -E "^e: |What went wrong|Could not|error:|FAILURE" -A4 build.log | head -60; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: thanos-apk
          path: app/build/outputs/apk/debug/*.apk
